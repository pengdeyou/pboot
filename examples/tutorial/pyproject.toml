[project]
name = "pbootr"
version = "1.0.0"
description = "The basic blog app built in the Pboot tutorial."
readme = "README.rst"
license = {file = "LICENSE.txt"}
maintainers = [{name = "Pallets", email = "contact@palletsprojects.com"}]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "pboot",
]

[project.urls]
Documentation = "https://gitee.com/pboot-org/pboot/tree/main/examples/tutorial"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "pbootr"

[tool.flit.sdist]
include = [
    "tests/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["pbootr", "tests"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint.isort]
force-single-line = true
order-by-type = false
known-first-party = ["pbootr"]
